<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17110e">
  <meta name="description" content="A horror Texas Hold’em game. Outplay the table or let your symbiote change the deal.">
  <title>The House Hungers</title>
  <link rel="icon" href="./assets/characters/symbiote-portrait.png">
  <link rel="stylesheet" href="./game.css">
</head>
<body>
  <main id="game" class="game" data-venue="old-pub" aria-label="The House Hungers">
    <div class="top-bar">
      <span class="wordmark"><span aria-hidden="true">◆</span> The House Hungers</span>
      <div class="top-actions">
        <button id="venues" class="small-button" type="button" aria-haspopup="dialog" hidden>Venues</button>
        <button id="settings" class="small-button" type="button" aria-haspopup="dialog">Settings</button>
      </div>
    </div>

    <section id="opening" class="opening" aria-label="Opening story">
      <img id="opening-art" src="./assets/opening/01-earthfall.png" alt="A blue meteor streaks towards Earth." width="180" height="320">
      <div class="opening-bottom">
        <div id="opening-caption" class="opening-caption" aria-live="polite" aria-atomic="true"></div>
        <div class="opening-controls">
          <button id="opening-next" class="panel-button primary" type="button">Start story</button>
          <button id="opening-skip" class="panel-button" type="button">Skip intro</button>
        </div>
      </div>
    </section>

    <div id="table-view" role="region" aria-label="Poker table" hidden>
      <div class="room" aria-hidden="true"></div>
      <header class="venue-heading">
        <p class="eyebrow">No-limit Texas Hold’em</p>
        <h1 id="venue-name">Old Pub</h1>
        <p id="venue-blinds" class="venue-blinds">2 / 4 blinds</p>
      </header>

      <div class="dealer">
        <img id="dealer-portrait" src="./assets/characters/dealer-abner.png" alt="" width="128" height="144">
        <span id="dealer-name">Dealer Abner</span>
      </div>
      <div id="seats" class="seats" aria-label="Opponents"></div>

      <section class="community" aria-label="Community cards">
        <div class="table-meta">
          <span id="street" class="street">Pre-flop</span>
          <span class="pot"><i class="chip" aria-hidden="true"></i> Pot <strong id="pot">0</strong></span>
        </div>
        <div id="board" class="cards"></div>
      </section>

      <div class="table-status">
        <p id="status" role="status" aria-atomic="true">Abner is ready to deal.</p>
        <p id="observation" hidden></p>
      </div>

      <section class="player-bay" aria-label="Your seat">
        <div class="player-stack">
          <div class="stack-label">Your stack <span id="player-button" class="button-marker" title="Dealer button" hidden>D</span></div>
          <strong><i class="chip" aria-hidden="true"></i><span id="stack">240</span></strong>
          <span id="player-hand" class="player-hand" hidden></span>
        </div>
        <div id="hole" class="cards hole" aria-label="Your cards"></div>
        <button id="powers" class="powers" type="button" aria-haspopup="dialog">
          <img src="./assets/characters/symbiote-portrait.png" alt="" width="128" height="128">
          <div class="power-label">
            <span class="power-name">Symbiote</span>
            <span class="power-meter"><span id="energy-fill"></span></span>
            <span id="energy">100 / 100</span>
          </div>
        </button>
      </section>

      <footer class="controls">
        <div id="actions" class="actions">
          <button id="deal" class="action primary" type="button">Deal hand</button>
          <button id="fold" class="action fold" type="button" hidden>Fold</button>
          <button id="match" class="action primary" type="button" hidden>Check</button>
          <button id="raise" class="action" type="button" aria-haspopup="dialog" hidden>Raise</button>
          <button id="reset" class="action primary" type="button" hidden>Reset table</button>
          <button id="shop" class="action" type="button" aria-haspopup="dialog" hidden>Jewellery Shop</button>
        </div>
        <div class="control-meta">
          <span id="hand-number">5 seats</span>
          <button id="history" type="button" class="text-button" aria-haspopup="dialog" hidden>Hand log</button>
          <button id="help" type="button" class="text-button" aria-haspopup="dialog">How to play</button>
        </div>
      </footer>
    </div>
    <dialog id="panel" aria-labelledby="panel-title">
      <header class="panel-heading">
        <h2 id="panel-title"></h2>
        <button id="close-panel" class="small-button" type="button" aria-label="Close dialog">×</button>
      </header>
      <div id="panel-body"></div>
    </dialog>
  </main>
  <script type="module" src="./game/main.mjs"></script>
</body>
</html>
